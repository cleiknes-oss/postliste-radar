name: Nattlig innhenting

on:
  schedule:
    - cron: "17 1 * * *"   # ca. 02:17 norsk vintertid / 03:17 sommertid
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config.yaml", "radar/**", ".github/workflows/nightly.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hent postlister
        run: python -m radar.collect
      - name: Bygg dashboard
        run: python -m radar.build
      - name: Lagre historikk
        run: |
          git config user.name "postliste-radar"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Data $(date +%F)"
          git push || (git pull --rebase && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
