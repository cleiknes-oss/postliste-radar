<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Postliste-radar · Enebakk</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#fff; --ink:#1d2321; --muted:#5f6b66; --line:#e3e1da;
    --accent:#2f6b4f; --accent-soft:#e6f0ea;
    --g-enebakk:#2f6b4f; --g-ostmarka:#7a5a1e; --g-region:#2d5d8a; --g-nnd:#9a3b2e; --g-sak:#5b5f66; --g-presse:#6b3f86;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#141716; --card:#1c201f; --ink:#e8ebe9; --muted:#9aa5a0; --line:#2c3230; --accent:#7cc39c; --accent-soft:#1f2d26;
      --g-enebakk:#7cc39c; --g-ostmarka:#d9b26a; --g-region:#7fb0de; --g-nnd:#e08b7d; --g-sak:#b3b8bf; --g-presse:#c39be0;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}
  .top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 0}
  h1{font-size:19px;margin:0;letter-spacing:-.01em}
  h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
  .tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=search]{font:inherit;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:260px}
  label.chk{font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center;cursor:pointer}
  nav.jump{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 10px}
  nav.jump a{font-size:12.5px;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--card)}
  nav.jump a b{color:var(--ink)}
  main{padding:18px 0 60px}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 16px;overflow:hidden}
  section>h2{margin:0;padding:12px 16px;font-size:15.5px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line)}
  section>h2 .n{font-weight:400;color:var(--muted);font-size:13px}
  section.primary{border:2px solid var(--accent)}
  section.primary>h2{background:var(--accent-soft)}
  section.focus>h2{background:color-mix(in srgb,var(--g-ostmarka) 12%,var(--card))}
  section.mention>h2{background:color-mix(in srgb,var(--g-enebakk) 9%,var(--card))}
  .sub{padding:8px 16px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  ul{list-style:none;margin:0;padding:0}
  li.it{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:9px 16px;border-top:1px solid var(--line)}
  li.it:first-child{border-top:0}
  .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:1px}
  .d .dir{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-top:3px}
  .t a{color:var(--ink);text-decoration:none;font-weight:550}
  .t a:hover{text-decoration:underline}
  .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .meta .src{color:var(--ink);font-weight:500}
  .chips{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:4px;vertical-align:1px}
  .chip{font-size:11px;border-radius:999px;padding:0 7px;border:1px solid currentColor;white-space:nowrap}
  .new{font-size:10.5px;font-weight:700;background:var(--accent);color:var(--card);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px}
  .empty{padding:12px 16px;color:var(--muted);font-size:13.5px}
  details>summary{cursor:pointer;padding:10px 16px;color:var(--accent);font-size:13.5px;border-top:1px solid var(--line);list-style:none}
  details>summary::-webkit-details-marker{display:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:16px}
  @media (max-width:600px){.grid{grid-template-columns:1fr} li.it{grid-template-columns:70px 1fr} input[type=search]{width:100%} .tools{margin-left:0;width:100%}}
  .grid section{margin:0}
  .rank{font-size:11.5px;color:var(--muted);margin-left:auto;font-weight:400}
  footer{font-size:12.5px;color:var(--muted)}
  footer table{border-collapse:collapse;width:100%}
  footer td{padding:4px 8px;border-top:1px solid var(--line);vertical-align:top}
  .bad{color:var(--g-nnd);font-weight:600}
  .kwlist{padding:10px 16px;font-size:12.5px;line-height:1.9}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1>Postliste-radar · Enebakk <small id="gen"></small></h1>
    <div class="tools">
      <input type="search" id="q" placeholder="Filtrer på ord, sak, avsender …" autocomplete="off">
      <label class="chk"><input type="checkbox" id="onlyNew"> Bare nye siden sist</label>
    </div>
  </div>
  <nav class="jump" id="jump"></nav>
</div></header>
<main class="wrap" id="app"></main>
<script>
const D = /*__DATA__*/null;
const GROUP = {enebakk:"Enebakk",ostmarka:"Østmarka",region:"Region",nnd:"NND",sak:"Sak",presse:"Presse"};
const KW = Object.fromEntries(D.keywords.map(k=>[k.term,k]));
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => d ? d.slice(8,10)+"."+d.slice(5,7)+"."+d.slice(2,4) : "";
const DIR = {I:"Inn",U:"Ut",N:"Notat",X:"Notat",S:"Sak"};
let Q = "", ONLYNEW = false;

function pass(i){
  if (ONLYNEW && !i.new) return false;
  if (!Q) return true;
  return [i.title,i.party,i.case,i.caseno,i.source_label,i.agency,(i.terms||[]).join(" ")].join(" ").toLowerCase().includes(Q);
}
function chips(i){
  return (i.terms||[]).map(t=>{const g=(KW[t]||{}).group||"sak";return `<span class="chip" style="color:var(--g-${g})">${esc(t)}</span>`}).join("");
}
function item(i, showSrc){
  const src = showSrc ? `<span class="src">${esc(i.agency||i.source_label)}</span> · ` : "";
  const party = i.party ? `${i.direction==="U"?"Til":i.direction==="I"?"Fra":""} ${esc(i.party)} · ` : "";
  const sak = i.case||i.caseno ? `Sak ${esc(i.caseno||"")} ${esc(i.case && i.case!==i.caseno ? i.case : "")}` : "";
  return `<li class="it"><div class="d">${fmt(i.date)}<br><span class="dir">${esc(DIR[i.direction]||i.doctype||"")}</span></div>
    <div class="t">${i.new?'<span class="new">NY</span>':""}<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
    <span class="chips">${chips(i)}</span>
    <div class="meta">${src}${party}${sak}</div></div></li>`;
}
function list(items, showSrc, limit){
  const f = items.filter(pass);
  if (!f.length) return `<div class="empty">${Q||ONLYNEW?"Ingen treff med gjeldende filter.":"Ingen treff."}</div>`;
  const head = f.slice(0,limit||f.length), rest = limit ? f.slice(limit) : [];
  return `<ul>${head.map(i=>item(i,showSrc)).join("")}</ul>` +
    (rest.length ? `<details><summary>Vis ${rest.length} flere</summary><ul>${rest.map(i=>item(i,showSrc)).join("")}</ul></details>` : "");
}
function count(items){ return items.filter(pass).length; }

function render(){
  const s = [];
  const nav = [];
  // 1. Enebakk – alltid øverst
  s.push(`<section class="primary" id="s-enebakk"><h2>Enebakk kommune – postliste <span class="n">${count(D.enebakkHits)} treff på søkeord siste ${D.lookback} dager</span></h2>
    ${list(D.enebakkHits,false,25)}
    <details ${Q?"open":""}><summary>Hele postlisten siste ${D.fullDays} dager (${count(D.enebakkAll)} poster)</summary>${list(D.enebakkAll,false)}</details></section>`);
  nav.push(["s-enebakk","Enebakk",count(D.enebakkHits)]);
  // 2. Fokus Østmarka
  s.push(`<section class="focus" id="s-ostmarka"><h2>Fokus: Østmarka nasjonalpark og nasjonalparksenter <span class="n">${count(D.ostmarka)} poster, alle kilder</span></h2>${list(D.ostmarka,true,15)}</section>`);
  nav.push(["s-ostmarka","Østmarka",count(D.ostmarka)]);
  // 3. Enebakk nevnt i andre lister
  s.push(`<section class="mention" id="s-mention"><h2>Enebakk nevnt i andre postlister <span class="n">${count(D.mentioned)} poster</span></h2>${list(D.mentioned,true,20)}</section>`);
  nav.push(["s-mention","Enebakk nevnt",count(D.mentioned)]);
  // 4. Øvrige kilder etter relevans
  const cards = D.sources.map((src,ix)=>{
    nav.push(["src-"+src.id,src.label.replace(/ kommune$/,"").replace(/^Statsforvalteren.*/,"Statsforvalteren"),count(src.items)]);
    return `<section id="src-${src.id}"><h2>${esc(src.label)} <span class="n">${count(src.items)} relevante</span><span class="rank">#${ix+1} relevans</span></h2>${list(src.items,src.id.startsWith("einnsyn")||src.id==="regjeringen",8)}</section>`;
  });
  s.push(`<div class="grid">${cards.join("")}</div>`);
  if (D.quiet.length) s.push(`<p class="empty" style="padding:14px 2px">Ingen relevante treff siste ${D.lookback} dager: ${D.quiet.map(esc).join(", ")}.</p>`);
  // Footer
  const st = D.status.sources.map(x=>`<tr><td>${esc(x.source)}</td><td>${x.ok?`${x.items} poster`:`<span class="bad">Feil</span> ${esc(x.error)}`}</td><td>${(x.notes||[]).map(esc).join("<br>")}</td></tr>`).join("");
  const kws = D.keywords.map(k=>`<span class="chip" style="color:var(--g-${k.group})" title="vekt ${k.weight}, ${k.scope}">${esc(k.term)}</span>`).join(" ");
  s.push(`<section><h2>Søkeord <span class="n">endres i config.yaml</span></h2><div class="kwlist">${kws}</div></section>
    <footer><section><h2>Kildestatus <span class="n">siste kjøring ${esc(D.status.run.replace("T"," "))}</span></h2><table>${st}</table></section></footer>`);
  document.getElementById("app").innerHTML = s.join("");
  document.getElementById("jump").innerHTML = nav.map(([id,l,n])=>`<a href="#${id}">${esc(l)} <b>${n}</b></a>`).join("");
}
document.getElementById("gen").textContent = "oppdatert " + D.generated;
document.getElementById("q").addEventListener("input", e=>{Q=e.target.value.trim().toLowerCase(); render();});
document.getElementById("onlyNew").addEventListener("change", e=>{ONLYNEW=e.target.checked; render();});
render();
</script>
</body>
</html>
